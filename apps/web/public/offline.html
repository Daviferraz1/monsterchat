<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MonsterChat — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d0d1a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 24px;
      }
      .card { max-width: 320px; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #7c3aed; margin: 0 3px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 20px; background: #7c3aed; color: #fff; border: 0;
        padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <h1>Você está offline</h1>
      <p>Não foi possível conectar. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
